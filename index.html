<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Loja - EMX Systems</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .preview-img { width: 100px; height: 100px; object-fit: cover; border-radius: 8px; }
    </style>
</head>
<body class="bg-gray-100 p-5">

    <div class="max-w-2xl mx-auto bg-white p-8 rounded-xl shadow-md">
        <h2 class="text-2xl font-bold mb-6">Cadastrar Nova Loja</h2>
        
        <form id="formLoja" class="space-y-4">
            <div>
                <label class="block font-medium">Nome da Loja/Espaço</label>
                <input type="text" class="w-full border p-2 rounded" placeholder="Ex: Sala 204 - Shopping Leblon" required>
            </div>

            <div>
                <label class="block font-medium">Fotos da Loja (Máximo 10)</label>
                <input type="file" id="fotos" accept="image/*" multiple class="w-full border p-2 rounded">
                <p id="contador" class="text-sm text-gray-500 mt-1">0 de 10 fotos selecionadas</p>
                <div id="previewContainer" class="flex flex-wrap gap-2 mt-3"></div>
            </div>

            <div>
                <label class="block font-medium">Link do Vídeo (YouTube/Vimeo)</label>
                <input type="url" class="w-full border p-2 rounded" placeholder="https://www.youtube.com/watch?v=...">
            </div>

            <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700 transition">
                Salvar Anúncio
            </button>
        </form>
    </div>

    <script>
        const inputFotos = document.getElementById('fotos');
        const previewContainer = document.getElementById('previewContainer');
        const contador = document.getElementById('contador');

        inputFotos.addEventListener('change', function() {
            const arquivos = Array.from(this.files);
            
            // Lógica do Limite de 10 fotos
            if (arquivos.length > 10) {
                alert("Você só pode enviar no máximo 10 fotos!");
                this.value = ""; // Limpa a seleção
                previewContainer.innerHTML = "";
                contador.innerText = "0 de 10 fotos selecionadas";
                return;
            }

            // Atualiza o contador e a pré-visualização
            contador.innerText = `${arquivos.length} de 10 fotos selecionadas`;
            previewContainer.innerHTML = ""; // Limpa antes de mostrar as novas

            arquivos.forEach(file => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    img.classList.add('preview-img');
                    previewContainer.appendChild(img);
                }
                reader.readAsDataURL(file);
            });
        });

        document.getElementById('formLoja').onsubmit = (e) => {
            e.preventDefault();
            alert("Pronto! Agora o próximo passo é conectar ao Banco de Dados (Supabase) para salvar as informações.");
        }
    </script>
</body>
</html>

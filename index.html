<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Imobiliário EMX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .page { display: none; }
        .page-active { display: block !important; }
        .flex-active { display: flex !important; }
    </style>
</head>
<body class="bg-gray-50">

    <div id="page-home" class="page page-active">
        <nav class="bg-white shadow px-6 py-4 flex justify-between items-center">
            <div class="text-2xl font-bold text-blue-600">EMX<span class="text-gray-800 font-normal">Systems</span></div>
            <button onclick="irPara('page-login')" class="bg-blue-600 text-white px-6 py-2 rounded-lg font-bold">Entrar</button>
        </nav>

        <div class="bg-slate-800 text-white py-20 text-center px-4">
            <h1 class="text-4xl md:text-5xl font-bold mb-4">Marketplace de Lojas e Shoppings</h1>
            <p class="text-gray-300 mb-8 text-lg">A maior vitrine comercial para o seu negócio.</p>
            <div class="max-w-xl mx-auto bg-white rounded-lg p-2 flex">
                <input type="text" placeholder="Qual shopping você busca?" class="flex-1 p-3 text-gray-800 outline-none">
                <button class="bg-blue-600 px-6 py-3 rounded-lg font-bold">Buscar</button>
            </div>
        </div>

        <div class="max-w-6xl mx-auto p-10">
            <h2 class="text-2xl font-bold mb-6">Lojas em Destaque</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="bg-white rounded-xl shadow p-4">
                    <img src="https://images.unsplash.com/photo-1567401893414-76b7b1e5a7a5?w=400" class="rounded-lg mb-4">
                    <h3 class="font-bold">Loja Shopping Rio Sul</h3>
                    <p class="text-blue-600 font-bold">R$ 5.000,00</p>
                </div>
            </div>
        </div>
    </div>

    <div id="page-login" class="page h-screen bg-slate-900 items-center justify-center">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-sm mx-auto mt-20">
            <h2 class="text-2xl font-bold text-center mb-6">Acesso Master</h2>
            <div class="space-y-4">
                <input type="email" id="userEmail" placeholder="admin@emx.com" class="w-full border p-3 rounded-lg">
                <input type="password" id="userPass" placeholder="123456" class="w-full border p-3 rounded-lg">
                <button onclick="tentarLogin()" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold">Acessar Painel</button>
                <button onclick="irPara('page-home')" class="w-full text-gray-500 text-sm">Voltar</button>
            </div>
        </div>
    </div>

    <div id="page-admin" class="page h-screen flex">
        <div class="w-64 bg-slate-900 text-white p-6">
            <h2 class="text-xl font-bold text-blue-500 mb-10 text-center">EMX MASTER</h2>
            <nav class="space-y-4">
                <a href="#" class="block p-3 bg-blue-600 rounded-lg">Dashboard</a>
                <a href="#" class="block p-3 hover:bg-slate-800 rounded">Minhas Lojas</a>
                <a href="#" onclick="irPara('page-home')" class="block p-3 text-red-400 mt-20">Sair</a>
            </nav>
        </div>
        <div class="flex-1 bg-gray-100 p-10 overflow-y-auto">
            <div class="flex justify-between items-center mb-10">
                <h1 class="text-3xl font-bold">Gestão de Lojas</h1>
                <button class="bg-blue-600 text-white px-6 py-2 rounded-lg">+ Nova Loja</button>
            </div>
            
            <div class="bg-white rounded-xl shadow">
                <table class="w-full text-left">
                    <tr class="bg-gray-50 border-b">
                        <th class="p-4">Nome</th>
                        <th class="p-4">Preço</th>
                        <th class="p-4">Status</th>
                    </tr>
                    <tr>
                        <td class="p-4">Loja Exemplo 01</td>
                        <td class="p-4">R$ 3.200</td>
                        <td class="p-4"><span class="text-green-600 font-bold">Ativo</span></td>
                    </tr>
                </table>
            </div>
        </div>
    </div>

    <script>
        function irPara(idPagina) {
            // Esconde todas as páginas
            const paginas = document.querySelectorAll('.page');
            paginas.forEach(p => {
                p.classList.remove('page-active');
                p.classList.remove('flex-active');
            });

            // Mostra a página escolhida
            const destino = document.getElementById(idPagina);
            if (idPagina === 'page-login' || idPagina === 'page-admin') {
                destino.classList.add('flex-active'); // Usa flex para centralizar login e montar dashboard
            } else {
                destino.classList.add('page-active');
            }
        }

        function tentarLogin() {
            const email = document.getElementById('userEmail').value;
            const pass = document.getElementById('userPass').value;

            if (email === "admin@emx.com" && pass === "123456") {
                irPara('page-admin');
            } else {
                alert("E-mail ou senha incorretos!");
            }
        }
    </script>

</body>
</html>

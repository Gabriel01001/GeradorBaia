<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMX Systems - Gestão de Vendas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .page { display: none !important; }
        .page-active { display: block !important; }
        .flex-active { display: flex !important; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body class="bg-gray-50 font-sans text-gray-900">

    <div id="page-home" class="page page-active">
        <nav class="bg-white shadow-sm py-4 px-8 flex justify-between items-center sticky top-0 z-50">
            <div class="text-2xl font-bold text-blue-600 tracking-tighter">EMX<span class="text-gray-800 font-light">Systems</span></div>
            <button onclick="irPara('page-login')" class="bg-blue-600 text-white px-7 py-2.5 rounded-full font-bold hover:bg-blue-700 transition">Entrar</button>
        </nav>
        <div class="h-[300px] bg-slate-800 flex items-center justify-center text-white">
            <h1 class="text-4xl font-bold italic opacity-20">EMX SYSTEMS - PORTAL DE IMÓVEIS</h1>
        </div>
    </div>

    <div id="page-login" class="page h-screen bg-slate-900 items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl p-10">
            <h2 class="text-3xl font-bold text-center mb-8">Acesso ao Sistema</h2>
            <div class="space-y-4">
                <input type="email" id="userEmail" class="w-full p-4 border rounded-xl outline-none" placeholder="E-mail">
                <input type="password" id="userPass" class="w-full p-4 border rounded-xl outline-none" placeholder="Senha">
                <button onclick="tentarLogin()" class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold shadow-lg hover:bg-blue-700 transition">Entrar</button>
                <button onclick="irPara('page-home')" class="w-full text-gray-400 text-sm">Voltar</button>
            </div>
        </div>
    </div>

    <div id="page-vendedor" class="page h-screen flex overflow-hidden">
        <aside class="w-64 bg-slate-900 text-white p-6 flex flex-col shadow-xl">
            <div class="text-lg font-bold mb-10 text-green-400">PAINEL VENDEDOR</div>
            <nav class="flex-1 space-y-3">
                <button onclick="switchTabVendedor('v-minhas-lojas')" class="w-full flex items-center gap-3 p-4 bg-slate-800 rounded-2xl text-white text-left">
                    <i class="fa-solid fa-list"></i> Minhas Lojas
                </button>
                <button onclick="switchTabVendedor('v-nova-loja')" class="w-full flex items-center gap-3 p-4 hover:bg-green-600 rounded-2xl text-white text-left transition">
                    <i class="fa-solid fa-plus-circle"></i> Cadastrar Loja
                </button>
            </nav>
            <button onclick="irPara('page-home')" class="text-red-400 p-4 text-left hover:bg-red-500/10 rounded-2xl transition"><i class="fa-solid fa-power-off mr-2"></i> Sair</button>
        </aside>

        <main class="flex-1 bg-gray-50 p-10 overflow-y-auto">
            
            <div id="v-minhas-lojas" class="tab-content-v active">
                <h1 class="text-3xl font-bold mb-6">Minhas Lojas Cadastradas</h1>
                <div id="gridLojasVendedor" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <div class="bg-gray-200 border-2 border-dashed border-gray-300 rounded-3xl h-64 flex items-center justify-center text-gray-400">
                        Nenhuma loja cadastrada ainda.
                    </div>
                </div>
            </div>

            <div id="v-nova-loja" class="tab-content-v">
                <h1 class="text-3xl font-bold mb-6">Cadastrar Novo Espaço</h1>
                <form id="formNovaLoja" class="bg-white p-8 rounded-3xl shadow-sm border border-gray-100 grid grid-cols-1 md:grid-cols-2 gap-6">
                    
                    <div class="md:col-span-2 grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-1">Nome do Shopping</label>
                            <input type="text" id="lojaShopping" required class="w-full p-3 bg-gray-50 border rounded-xl" placeholder="Ex: Barra Shopping">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-1">Endereço Completo</label>
                            <input type="text" id="lojaEndereco" required class="w-full p-3 bg-gray-50 border rounded-xl" placeholder="Rua, Número, Bairro...">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Metros Quadrados (m²)</label>
                        <input type="number" id="lojaM2" required class="w-full p-3 bg-gray-50 border rounded-xl" placeholder="Ex: 45">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Tipo de Espaço</label>
                        <select id="lojaTipo" onchange="checkAlimentacao(this.value)" class="w-full p-3 bg-gray-50 border rounded-xl">
                            <option value="Loja">Loja Comercial</option>
                            <option value="Quiosque">Quiosque</option>
                        </select>
                    </div>

                    <div id="boxAlimentacao" class="md:col-span-2 flex items-center gap-3 bg-blue-50 p-4 rounded-xl">
                        <input type="checkbox" id="lojaAlimentacao" class="w-5 h-5">
                        <label for="lojaAlimentacao" class="text-sm font-bold text-blue-800">Este espaço faz parte da Praça de Alimentação?</label>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Foto Principal + 9 fotos</label>
                        <input type="file" multiple accept="image/*" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Vídeo 360° (Curto)</label>
                        <input type="file" accept="video/*" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-green-50 file:text-green-700 hover:file:bg-green-100">
                    </div>

                    <div class="md:col-span-2">
                        <label class="block text-sm font-bold text-gray-700 mb-1">WhatsApp para Contato (Vendedor)</label>
                        <input type="text" id="lojaZap" required class="w-full p-3 bg-gray-50 border border-blue-200 rounded-xl font-bold text-blue-600" placeholder="(21) 99999-9999">
                    </div>

                    <div class="md:col-span-2 pt-4">
                        <button type="submit" class="w-full bg-green-600 text-white py-4 rounded-2xl font-bold shadow-lg hover:bg-green-700 transition">Publicar Loja no Portal</button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <div id="page-admin" class="page h-screen flex">
        <aside class="w-64 bg-slate-900 text-white p-6">
            <h2 class="text-xl font-bold mb-10 text-blue-500 uppercase">Master Admin</h2>
            <button onclick="irPara('page-home')" class="text-red-400">Sair</button>
        </aside>
        <main class="p-10"><h1>Painel Master - Gestão Global</h1></main>
    </div>

    <script>
        function irPara(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('page-active', 'flex-active'));
            const d = document.getElementById(id);
            if(id === 'page-login' || id === 'page-vendedor' || id === 'page-admin') d.classList.add('flex-active');
            else d.classList.add('page-active');
        }

        function switchTabVendedor(id) {
            document.querySelectorAll('.tab-content-v').forEach(t => t.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function checkAlimentacao(valor) {
            const box = document.getElementById('boxAlimentacao');
            box.style.display = (valor === 'Loja') ? 'flex' : 'none';
        }

        function tentarLogin() {
            const e = document.getElementById('userEmail').value;
            if(e === "admin@emx.com") {
                irPara('page-admin');
            } else {
                // Simula que qualquer outro login cai no painel do vendedor
                irPara('page-vendedor');
                document.getElementById('lojaZap').value = "(21) 98888-7777"; // Simula preenchimento automático do zap do vendedor
            }
        }

        document.getElementById('formNovaLoja').onsubmit = function(e) {
            e.preventDefault();
            const shopping = document.getElementById('lojaShopping').value;
            const m2 = document.getElementById('lojaM2').value;
            const tipo = document.getElementById('lojaTipo').value;

            const card = `
                <div class="bg-white rounded-3xl overflow-hidden shadow-sm border border-gray-100">
                    <div class="h-40 bg-gray-200 flex items-center justify-center text-gray-400">IMAGEM</div>
                    <div class="p-5">
                        <h3 class="font-bold">${tipo} - ${m2}m²</h3>
                        <p class="text-xs text-gray-500"><i class="fa-solid fa-building mr-1"></i> ${shopping}</p>
                        <div class="mt-4 flex justify-between items-center">
                            <span class="text-xs bg-green-100 text-green-700 px-2 py-1 rounded-full font-bold">EM ANÁLISE</span>
                            <button class="text-blue-600 text-xs font-bold">Ver Detalhes</button>
                        </div>
                    </div>
                </div>
            `;
            
            const grid = document.getElementById('gridLojasVendedor');
            if(grid.innerText.includes('Nenhuma loja')) grid.innerHTML = "";
            grid.innerHTML += card;
            
            alert("Sucesso! Loja enviada para o banco de dados.");
            switchTabVendedor('v-minhas-lojas');
            this.reset();
        };
    </script>
</body>
</html>

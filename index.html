<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMX Lojas - Premium Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Regras de Ouro para Esconder/Mostrar */
        .page { display: none !important; }
        .page-active { display: block !important; }
        .flex-active { display: flex !important; }
        
        .hero-gradient { background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)); }
    </style>
</head>
<body class="bg-gray-50 font-sans text-gray-900">

    <div id="page-home" class="page page-active">
        <nav class="bg-white shadow-sm py-4 px-8 flex justify-between items-center sticky top-0 z-50">
            <div class="text-2xl font-bold text-blue-600 tracking-tighter">EMX<span class="text-gray-800 font-light">Systems</span></div>
            <button onclick="irPara('page-login')" class="bg-blue-600 text-white px-7 py-2.5 rounded-full font-bold hover:bg-blue-700 transition shadow-lg">
                Entrar
            </button>
        </nav>

        <header class="relative h-[500px] flex items-center justify-center text-white">
            <img src="https://images.unsplash.com/photo-1567401893414-76b7b1e5a7a5?auto=format&fit=crop&w=1350&q=80" class="absolute inset-0 w-full h-full object-cover">
            <div class="absolute inset-0 hero-gradient"></div>
            <div class="relative z-10 text-center px-4">
                <h1 class="text-4xl md:text-6xl font-extrabold mb-4">O melhor ponto para o seu negócio</h1>
                <p class="text-xl mb-8 text-gray-200">Encontre lojas e quiosques nos shoppings mais movimentados.</p>
                <div class="bg-white p-2 rounded-xl shadow-2xl flex flex-col md:flex-row max-w-2xl mx-auto gap-2">
                    <input type="text" placeholder="Qual shopping ou cidade?" class="flex-1 p-4 text-gray-800 outline-none rounded-lg">
                    <button class="bg-blue-600 px-8 py-4 rounded-lg font-bold">Buscar</button>
                </div>
            </div>
        </header>

        <main class="max-w-7xl mx-auto py-16 px-8 text-center">
            <h2 class="text-3xl font-bold mb-10">Lojas Disponíveis</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                <div class="bg-white rounded-3xl overflow-hidden shadow-sm border border-gray-100">
                    <img src="https://images.unsplash.com/photo-1582037928769-181f2644ecb7?auto=format&fit=crop&w=600" class="w-full h-48 object-cover">
                    <div class="p-6 text-left">
                        <h3 class="font-bold text-lg">Loja Premium - 45m²</h3>
                        <p class="text-blue-600 font-bold">R$ 4.500,00</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="page-login" class="page h-screen bg-slate-900 items-center justify-center">
        <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl p-10 mx-auto">
            <h2 class="text-3xl font-bold text-center mb-8">Acesso Master</h2>
            <div class="space-y-6">
                <input type="email" id="userEmail" class="w-full p-4 border rounded-xl outline-none" placeholder="admin@emx.com">
                <input type="password" id="userPass" class="w-full p-4 border rounded-xl outline-none" placeholder="123456">
                <button onclick="tentarLogin()" class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold shadow-xl hover:bg-blue-700">Acessar Painel</button>
                <button onclick="irPara('page-home')" class="w-full text-gray-400 text-sm">Voltar para o site</button>
            </div>
        </div>
    </div>

    <div id="page-admin" class="page h-screen flex">
        <aside class="w-64 bg-slate-900 text-white flex flex-col p-6">
            <div class="text-xl font-bold mb-10 text-blue-500">EMX MASTER</div>
            <nav class="flex-1 space-y-4">
                <a href="#" class="block p-3 bg-blue-600 rounded-lg"><i class="fa-solid fa-gauge mr-2"></i> Dashboard</a>
                <a href="#" class="block p-3 hover:bg-slate-800 rounded-lg"><i class="fa-solid fa-store mr-2"></i> Minhas Lojas</a>
            </nav>
            <button onclick="irPara('page-home')" class="text-red-400 p-3 text-left"><i class="fa-solid fa-power-off mr-2"></i> Sair</button>
        </aside>

        <main class="flex-1 bg-gray-100 p-12 overflow-y-auto">
            <div class="flex justify-between items-center mb-10">
                <h1 class="text-3xl font-bold">Gestão Master</h1>
                <button class="bg-blue-600 text-white px-6 py-2 rounded-lg font-bold">+ Nova Loja</button>
            </div>
            <div class="bg-white rounded-2xl shadow p-6">
                <p class="text-gray-500 italic">Bem-vindo ao painel, Emmanuel. Gerencie suas lojas cadastradas aqui.</p>
            </div>
        </main>
    </div>

    <script>
        function irPara(idPagina) {
            // Esconde todas as divs que têm a classe 'page'
            const paginas = document.querySelectorAll('.page');
            paginas.forEach(p => {
                p.classList.remove('page-active');
                p.classList.remove('flex-active');
            });

            const destino = document.getElementById(idPagina);
            
            // Ativa a página correta
            if (idPagina === 'page-login' || idPagina === 'page-admin') {
                destino.classList.add('flex-active');
            } else {
                destino.classList.add('page-active');
            }
            window.scrollTo(0,0);
        }

        function tentarLogin() {
            const email = document.getElementById('userEmail').value;
            const pass = document.getElementById('userPass').value;

            if (email === "admin@emx.com" && pass === "123456") {
                irPara('page-admin');
            } else {
                alert("Login ou senha incorretos!");
            }
        }
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Login - EMX Systems</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-900 h-screen flex items-center justify-center px-4">

    <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden">
        
        <div class="bg-blue-600 p-8 text-center text-white">
            <div class="text-3xl font-extrabold tracking-tight mb-2">EMX<span class="text-blue-200">Systems</span></div>
            <p class="text-blue-100 opacity-80">Painel de Controle Master</p>
        </div>

        <form id="loginForm" class="p-8 space-y-6">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">E-mail Administrativo</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fa-solid fa-envelope"></i>
                    </span>
                    <input type="email" id="email" required
                        class="w-full pl-10 pr-4 py-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition" 
                        placeholder="admin@emxsystems.com.br">
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Senha Master</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" id="password" required
                        class="w-full pl-10 pr-4 py-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition" 
                        placeholder="••••••••">
                </div>
            </div>

            <button type="submit" 
                class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700 transform hover:scale-[1.02] transition-all duration-200 shadow-lg">
                Acessar Sistema
            </button>

            <div class="text-center">
                <a href="#" class="text-sm text-blue-600 hover:underline">Esqueceu a senha master?</a>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').onsubmit = function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;

            // Logica temporária de teste (Depois substituiremos pelo Supabase)
            if(email === "admin@emx.com" && pass === "123456") {
                alert("Acesso Master Concedido! Redirecionando para o painel...");
                // window.location.href = "painel-admin.html";
            } else {
                alert("Erro: Credenciais Master inválidas.");
            }
        };
    </script>

</body>
</html>

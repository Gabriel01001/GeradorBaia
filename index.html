<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMX Master - Gestão de Vendedores</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .page { display: none !important; }
        .page-active { display: block !important; }
        .flex-active { display: flex !important; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body class="bg-gray-50 font-sans">

    <div id="page-home" class="page">
        <button onclick="irPara('page-login')" class="m-10 bg-blue-600 text-white p-4 rounded">Entrar no Sistema</button>
    </div>

    <div id="page-login" class="page h-screen bg-slate-900 items-center justify-center">
        <div class="bg-white p-8 rounded-2xl w-full max-w-md">
            <h2 class="text-2xl font-bold mb-6 text-center">Login Master</h2>
            <input type="email" id="email" class="w-full p-3 border rounded mb-4" placeholder="admin@emx.com">
            <input type="password" id="password" class="w-full p-3 border rounded mb-4" placeholder="123456">
            <button onclick="fazerLogin()" class="w-full bg-blue-600 text-white py-3 rounded font-bold">Entrar</button>
        </div>
    </div>

    <div id="page-admin" class="page h-screen flex">
        
        <aside class="w-64 bg-slate-900 text-white p-6 flex flex-col shadow-xl">
            <div class="text-xl font-bold mb-10 text-blue-500 tracking-tighter text-center border-b border-slate-800 pb-4">
                EMX MASTER
            </div>
            <nav class="flex-1 space-y-2">
                <button onclick="switchTab('tab-lojas')" class="w-full flex items-center gap-3 p-3 hover:bg-slate-800 rounded-lg transition text-left">
                    <i class="fa-solid fa-store"></i> Gerenciar Lojas
                </button>
                <button onclick="switchTab('tab-vendedores')" class="w-full flex items-center gap-3 p-3 hover:bg-slate-800 rounded-lg transition text-left">
                    <i class="fa-solid fa-user-tie"></i> Cadastrar Vendedores
                </button>
            </nav>
            <button onclick="irPara('page-home')" class="text-red-400 p-3 text-left hover:bg-red-500/10 rounded-lg transition">
                <i class="fa-solid fa-power-off mr-2"></i> Sair
            </button>
        </aside>

        <main class="flex-1 bg-gray-50 p-8 overflow-y-auto">
            
            <div id="tab-lojas" class="tab-content active">
                <div class="flex justify-between items-center mb-8">
                    <h1 class="text-2xl font-bold text-slate-800">Lojas Cadastradas</h1>
                    <button class="bg-blue-600 text-white px-6 py-2 rounded-lg font-bold">+ Nova Loja</button>
                </div>
                <div class="bg-white rounded-xl shadow overflow-hidden">
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-gray-50 text-gray-400 text-xs uppercase font-bold">
                            <tr>
                                <th class="p-4">Identificação</th>
                                <th class="p-4">Preço</th>
                                <th class="p-4">Status</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-100">
                            <tr>
                                <td class="p-4 font-medium">Loja 204 - Rio Sul</td>
                                <td class="p-4 text-blue-600 font-bold">R$ 4.500</td>
                                <td class="p-4"><span class="bg-green-100 text-green-700 px-2 py-1 rounded text-[10px] font-bold">ATIVO</span></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div id="tab-vendedores" class="tab-content">
                <div class="flex justify-between items-center mb-8">
                    <div>
                        <h1 class="text-2xl font-bold text-slate-800">Equipe de Vendedores</h1>
                        <p class="text-sm text-gray-500">Crie acessos para quem vai anunciar as lojas.</p>
                    </div>
                    <button onclick="document.getElementById('modalVendedor').classList.remove('hidden')" class="bg-green-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-green-700 transition shadow-lg shadow-green-100">
                        + Adicionar Vendedor
                    </button>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="listaVendedores">
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-4">
                        <div class="w-12 h-12 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center font-bold text-xl">
                            E
                        </div>
                        <div class="flex-1">
                            <h3 class="font-bold text-slate-800">Emmanuel Martins</h3>
                            <p class="text-xs text-gray-400 italic">vendas.emmanuel@emx.com</p>
                        </div>
                        <button class="text-gray-300 hover:text-red-500"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="modalVendedor" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-[100] px-4">
        <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden">
            <div class="p-6 border-b flex justify-between items-center">
                <h3 class="text-xl font-bold">Novo Vendedor</h3>
                <button onclick="document.getElementById('modalVendedor').classList.add('hidden')" class="text-gray-400 text-2xl">&times;</button>
            </div>
            <form class="p-6 space-y-4" id="formVendedor">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Nome Completo</label>
                    <input type="text" id="nomeVendedor" class="w-full border p-3 rounded-xl outline-none focus:ring-2 focus:ring-green-500" placeholder="Ex: João Silva" required>
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">E-mail de Acesso</label>
                    <input type="email" id="emailVendedor" class="w-full border p-3 rounded-xl outline-none focus:ring-2 focus:ring-green-500" placeholder="joao@vendedor.com" required>
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Senha Provisória</label>
                    <input type="password" id="senhaVendedor" class="w-full border p-3 rounded-xl outline-none focus:ring-2 focus:ring-green-500" placeholder="••••••" required>
                </div>
                <button type="submit" class="w-full bg-green-600 text-white py-4 rounded-xl font-bold shadow-lg shadow-green-100 hover:bg-green-700 transition">
                    Criar Acesso Vendedor
                </button>
            </form>
        </div>
    </div>

    <script>
        // Troca de Páginas (Home / Login / Admin)
        function irPara(pageId) {
            document.querySelectorAll('.page').forEach(p => {
                p.classList.remove('page-active', 'flex-active');
            });
            const destino = document.getElementById(pageId);
            if (pageId === 'page-login' || pageId === 'page-admin') {
                destino.classList.add('flex-active');
            } else {
                destino.classList.add('page-active');
            }
        }

        // Troca de Abas dentro do Admin (Lojas / Vendedores)
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
        }

        function fazerLogin() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            if (email === "admin@emx.com" && pass === "123456") {
                irPara('page-admin');
            } else {
                alert("Login Master incorreto!");
            }
        }

        // Lógica de Cadastrar Vendedor (Simulação)
        document.getElementById('formVendedor').onsubmit = function(e) {
            e.preventDefault();
            const nome = document.getElementById('nomeVendedor').value;
            const email = document.getElementById('emailVendedor').value;

            // Cria o card do novo vendedor na tela
            const novoCard = `
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-4 animate-pulse">
                    <div class="w-12 h-12 bg-green-100 text-green-600 rounded-full flex items-center justify-center font-bold text-xl">
                        ${nome.charAt(0).toUpperCase()}
                    </div>
                    <div class="flex-1">
                        <h3 class="font-bold text-slate-800">${nome}</h3>
                        <p class="text-xs text-gray-400 italic">${email}</p>
                    </div>
                    <button class="text-gray-300"><i class="fa-solid fa-trash"></i></button>
                </div>
            `;
            
            document.getElementById('listaVendedores').innerHTML += novoCard;
            alert(`Vendedor ${nome} cadastrado com sucesso!`);
            document.getElementById('modalVendedor').classList.add('hidden');
            this.reset();
        };
    </script>
</body>
</html>
